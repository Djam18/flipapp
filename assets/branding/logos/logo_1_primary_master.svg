<svg width="480" height="90" viewBox="0 0 480 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond de présentation sombre -->
  <rect width="480" height="90" rx="16" fill="#000000"/>
  
  <!-- Symbole Flip to Focus -->
  <g transform="translate(30, 18)">
    <!-- Contour du smartphone avec chanfrein -->
    <rect x="0" y="0" width="36" height="54" rx="8" stroke="#8FA89B" stroke-width="3" fill="#121214"/>
    <!-- Haut-parleur / caméra -->
    <line x1="12" y1="6" x2="24" y2="6" stroke="#8FA89B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bouton / Capteur -->
    <circle cx="18" cy="45" r="2.5" fill="#8FA89B"/>
    <!-- Ondes de bascule physique (signal haptique) -->
    <path d="M44 14C52 22 52 32 44 40" stroke="#8FA89B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M52 8C64 20 64 34 52 46" stroke="#8FA89B" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Typographie du Logo -->
  <text x="110" y="44" fill="#F5F5F7" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5">FLIP TO FOCUS</text>
  <text x="112" y="64" fill="#8E8E93" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="3.5">DESIGNED FOR DEEP WORK</text>
</svg>
